seed: 42
train_dataset: HuggingFaceH4/ultrachat_200k
train_split: train_sft
text_field: messages
output_dir: artifacts/checkpoints

tokenizer_prefix: artifacts/tokenizer/xenutron_spm
tokenizer_vocab_size: 32000

micro_batch_size: 2
grad_accum_steps: 32
learning_rate: 0.0003
min_lr: 0.00003
weight_decay: 0.1
betas: [0.9, 0.95]
warmup_steps: 200
max_steps: 10000
grad_clip: 1.0

sequence_length: 2048
log_every: 10
eval_every: 500
save_every: 500

amp_dtype: bfloat16
