[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xenutron"
version = "0.1.0"
description = "Train and run Xenutron, a production-grade GPT-style LLM from scratch"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Xenutron Team"}]
dependencies = [
  "torch>=2.2.0",
  "numpy>=1.26.0",
  "sentencepiece>=0.1.99",
  "datasets>=2.18.0",
  "tqdm>=4.66.0",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
